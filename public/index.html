<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepostRx</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    section { margin-top: 2rem; }
    button { font-size: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.6; }
    input[type="datetime-local"] { font-size: 1rem; padding: 0.4rem; }
    input[type="url"] { font-size: 1rem; padding: 0.5rem; width: 100%; box-sizing: border-box; margin-bottom: 0.5rem; }
    textarea { font: inherit; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    .count { font-size: 0.875rem; color: #555; }
    .count.over { color: #b00020; font-weight: 600; }
    .error { color: #b00020; }
    .warning { color: #8a5300; }
    .schedule { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: #f4f4f6; border-radius: 6px; font-size: 0.95rem; }
    .muted { color: #555; }
    .confirm { margin-top: 0.75rem; padding: 0.75rem; border: 2px solid #8a5300; border-radius: 6px; background: #fff8e6; }
    .confirm-text { white-space: pre-wrap; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 0.5rem; }
    .confirm button { margin-right: 0.5rem; }
    .success { color: #1b6e20; font-weight: 600; }
  </style>
</head>
<body>
  <h1>RepostRx</h1>
  <p>Turn an article into scheduled social posts.</p>

  <section>
    <h2>1. Import an article</h2>
    <form id="import-form">
      <label for="url">Article URL</label>
      <input id="url" type="url" placeholder="https://example.com/article" required>
      <button id="import" type="submit">Import</button>
    </form>
    <div id="import-status" aria-live="polite"></div>

    <form id="paste-form">
      <label for="paste-text">Or paste the article text</label>
      <textarea id="paste-text" rows="8" required
        placeholder="Use this if the import can't read the article (for example, Substack posts)."></textarea>
      <label for="paste-url">Article link (optional, added to each draft)</label>
      <input id="paste-url" type="url" placeholder="https://example.com/article">
      <button id="paste-button" type="submit">Write drafts from pasted text</button>
    </form>
  </section>

  <section id="drafts" hidden>
    <h2>2. Edit your drafts</h2>
    <p id="article-title"></p>
    <div id="draft-warnings"></div>

    <label for="draft-linkedin">LinkedIn</label>
    <textarea id="draft-linkedin" rows="10"></textarea>
    <div class="schedule" id="schedule-linkedin" aria-live="polite"></div>

    <label for="draft-x">X</label>
    <textarea id="draft-x" rows="4"></textarea>
    <div id="x-count" class="count" aria-live="polite"></div>
    <div class="schedule" id="schedule-twitter" aria-live="polite"></div>

    <label for="draft-facebook">Facebook</label>
    <textarea id="draft-facebook" rows="8"></textarea>
    <div class="schedule" id="schedule-facebook" aria-live="polite"></div>
  </section>

  <section id="scheduled" hidden>
    <h2>Scheduled this session</h2>
    <ul id="scheduled-log"></ul>
  </section>

  <section>
    <h2>Connected accounts</h2>
    <button id="load">Load my accounts</button>
    <div id="result" aria-live="polite"></div>
  </section>

  <script>
    // ---------- Shared helpers ----------

    const POLL_EVERY_MS = 3000;     // check the import every 3 seconds
    const POLL_LIMIT_MS = 120000;   // give up after 2 minutes
    const X_LIMIT = 280;

    // Reads a JSON reply. If the server sent something else (e.g. Netlify's own
    // timeout page), returns a plain-English error instead of crashing.
    async function readJson(res) {
      try {
        return await res.json();
      } catch {
        return { error: `The server sent an unexpected reply (status ${res.status}). Try again shortly.` };
      }
    }

    // Shows a message in a container. textContent shows text as-is, so it can't inject HTML.
    function showMessage(container, message, className = "") {
      container.textContent = "";
      const p = document.createElement("p");
      if (className) p.className = className;
      p.textContent = message;
      container.appendChild(p);
    }

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // ---------- Import, poll, then draft ----------

    const importForm = document.getElementById("import-form");
    const importButton = document.getElementById("import");
    const urlInput = document.getElementById("url");
    const importStatus = document.getElementById("import-status");
    const draftsSection = document.getElementById("drafts");

    const pasteForm = document.getElementById("paste-form");
    const pasteButton = document.getElementById("paste-button");
    const pasteText = document.getElementById("paste-text");

    // Disables both buttons while either job runs, so only one runs at a time.
    function setBusy(busy) {
      importButton.disabled = busy;
      pasteButton.disabled = busy;
      if (busy) draftsSection.hidden = true;
    }

    importForm.addEventListener("submit", async (event) => {
      event.preventDefault(); // stay on the page instead of reloading it
      setBusy(true);
      try {
        const url = urlInput.value.trim();
        const article = await importArticle(url);
        if (article) await writeDrafts({ ...article, url });
      } catch {
        showMessage(importStatus, "Couldn't reach the RepostRx server. Check your connection and try again.", "error");
      } finally {
        setBusy(false);
      }
    });

    // Fallback: skip the import and write drafts from text the user pasted.
    pasteForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setBusy(true);
      try {
        await writeDrafts({
          title: "your pasted text",
          text: pasteText.value.trim(),
          url: document.getElementById("paste-url").value.trim(), // may be empty
        });
      } catch {
        showMessage(importStatus, "Couldn't reach the RepostRx server. Check your connection and try again.", "error");
      } finally {
        setBusy(false);
      }
    });

    // Starts the import, then checks until it's done. Returns { title, text } or null.
    async function importArticle(url) {
      showMessage(importStatus, "Sending the link to Blotato…");
      const startRes = await fetch("/.netlify/functions/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const start = await readJson(startRes);
      if (!startRes.ok) {
        showMessage(importStatus, start.error, "error");
        return null;
      }

      const deadline = Date.now() + POLL_LIMIT_MS;
      while (Date.now() < deadline) {
        await wait(POLL_EVERY_MS);
        const res = await fetch(`/.netlify/functions/import-status?id=${encodeURIComponent(start.id)}`);
        const data = await readJson(res);

        if (!res.ok) {
          showMessage(importStatus, data.error, "error");
          return null;
        }
        if (data.status === "completed") {
          return { title: data.title, text: data.text };
        }
        if (data.status === "failed") {
          showMessage(importStatus, data.error, "error");
          return null;
        }
        const seconds = Math.round((POLL_LIMIT_MS - (deadline - Date.now())) / 1000);
        showMessage(importStatus, data.status === "queued"
          ? `Queued at Blotato… (${seconds}s)`
          : `Reading the article… (${seconds}s)`);
      }

      showMessage(importStatus, "The import is taking longer than 2 minutes, so we stopped checking. The site may be slow or blocking imports. Try again, or try a different article.", "error");
      return null;
    }

    // Asks Claude for the three drafts and shows them in editable boxes.
    async function writeDrafts(article) {
      showMessage(importStatus, `Writing drafts from "${article.title}"…`);
      const res = await fetch("/.netlify/functions/drafts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: article.text, url: article.url }),
      });
      const data = await readJson(res);
      if (!res.ok) {
        showMessage(importStatus, data.error, "error");
        return;
      }

      document.getElementById("article-title").textContent = `From: ${article.title}`;
      document.getElementById("draft-linkedin").value = data.linkedin;
      document.getElementById("draft-x").value = data.x;
      document.getElementById("draft-facebook").value = data.facebook;
      updateXCount();

      const warningsBox = document.getElementById("draft-warnings");
      warningsBox.textContent = "";
      for (const warning of data.warnings ?? []) {
        const p = document.createElement("p");
        p.className = "warning";
        p.textContent = warning;
        warningsBox.appendChild(p);
      }

      showMessage(importStatus, "Drafts ready. Edit them below. Nothing has been posted.");
      draftsSection.hidden = false;
      showScheduleOptions(); // runs in the background; the drafts are usable right away
    }

    // ---------- Scheduling: which account each draft would post to ----------

    // Draft platforms, using Blotato's names ("twitter" is X).
    const SCHEDULE_PLATFORMS = [
      { platform: "linkedin", name: "LinkedIn", article: "a", textareaId: "draft-linkedin" },
      { platform: "twitter", name: "X", article: "an", textareaId: "draft-x" },
      { platform: "facebook", name: "Facebook", article: "a", textareaId: "draft-facebook" },
    ];

    // The account chosen for each platform, filled in by showScheduleOptions.
    // Account IDs always come from the accounts function, never from this code.
    const chosenAccount = {};

    function accountLabel(a) {
      return `${a.platform}: ${a.fullname || a.username || "(no name)"} (ID ${a.id})`;
    }

    async function showScheduleOptions() {
      for (const { platform, textareaId } of SCHEDULE_PLATFORMS) {
        showMessage(document.getElementById(`schedule-${platform}`), "Checking connected accounts…", "muted");
        delete chosenAccount[platform];
        document.getElementById(textareaId).readOnly = false; // new drafts are editable again
      }

      let accounts;
      try {
        const res = await fetch("/.netlify/functions/accounts");
        const data = await readJson(res);
        if (!res.ok) throw new Error(data.error);
        accounts = Array.isArray(data.items) ? data.items : Array.isArray(data) ? data : [];
      } catch (err) {
        const message = `Scheduling is unavailable because your accounts couldn't be loaded: ${err.message || "connection problem."}`;
        for (const { platform } of SCHEDULE_PLATFORMS) {
          showMessage(document.getElementById(`schedule-${platform}`), message, "error");
        }
        return;
      }

      for (const { platform, name, article } of SCHEDULE_PLATFORMS) {
        const box = document.getElementById(`schedule-${platform}`);
        const matches = accounts.filter((a) => a.platform === platform);

        if (matches.length === 0) {
          showMessage(box, `Not connected. Connect ${article} ${name} account at my.blotato.com to schedule this draft.`, "muted");
          continue;
        }
        if (platform === "facebook") {
          showMessage(box, "Scheduling to Facebook isn't supported yet (it needs a Page ID).", "muted");
          continue;
        }

        box.textContent = "";
        if (matches.length === 1) {
          chosenAccount[platform] = matches[0];
          const p = document.createElement("p");
          p.textContent = `Posts to: ${accountLabel(matches[0])}`;
          box.appendChild(p);
        } else {
          // Several accounts on one platform: let the user pick.
          const label = document.createElement("label");
          label.textContent = "Posts to:";
          const select = document.createElement("select");
          select.id = `account-${platform}`;
          label.htmlFor = select.id;
          for (const a of matches) {
            const option = document.createElement("option");
            option.value = String(a.id);
            option.textContent = accountLabel(a);
            select.appendChild(option);
          }
          chosenAccount[platform] = matches[0];
          select.addEventListener("change", () => {
            chosenAccount[platform] = matches.find((a) => String(a.id) === select.value);
          });
          box.append(label, select);
        }
        addTimePicker(box, platform);
        addScheduleButton(box, platform);
      }
    }

    // ---------- Scheduling: pick a time (local), shown in both local and UTC ----------

    const MIN_LEAD_MINUTES = 5; // same rule as schedule.mjs
    const TIME_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone; // e.g. "America/Los_Angeles"

    // The chosen time for each platform as a Date, or null if none or invalid.
    const chosenTime = {};

    // Formats a Date for the <input type="datetime-local"> min attribute (local time, no seconds).
    function toLocalInputValue(date) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // "Wed, Nov 18, 2026, 9:00 AM PST (America/Los_Angeles)"
    function formatLocal(date) {
      const text = date.toLocaleString("en-US", {
        weekday: "short", month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit", timeZoneName: "short",
      });
      return `${text} (${TIME_ZONE})`;
    }

    function addTimePicker(box, platform) {
      chosenTime[platform] = null;

      const label = document.createElement("label");
      label.textContent = "When to post (your local time):";
      const input = document.createElement("input");
      input.type = "datetime-local";
      input.id = `time-${platform}`;
      label.htmlFor = input.id;
      input.min = toLocalInputValue(new Date(Date.now() + MIN_LEAD_MINUTES * 60000));

      const line = document.createElement("p");
      line.className = "muted";
      line.textContent = "Pick a date and time.";

      input.addEventListener("input", () => {
        chosenTime[platform] = null;
        // A datetime-local value has no time zone, so the browser reads it as local time.
        const when = input.value ? new Date(input.value) : null;
        if (!when || Number.isNaN(when.getTime())) {
          line.className = "muted";
          line.textContent = "Pick a date and time.";
          return;
        }
        const minutesAhead = (when.getTime() - Date.now()) / 60000;
        if (minutesAhead < MIN_LEAD_MINUTES) {
          line.className = "error";
          line.textContent = minutesAhead < 0
            ? "That time is in the past. Pick a future time."
            : `That's too soon. Pick a time at least ${MIN_LEAD_MINUTES} minutes from now.`;
          return;
        }
        chosenTime[platform] = when;
        line.className = "";
        line.textContent = `${formatLocal(when)} → ${when.toISOString()} (UTC)`;
      });

      box.append(label, input, line);
    }

    // ---------- Scheduling: confirm, send once, show the ID ----------

    function tooSoon(when) {
      return when.getTime() - Date.now() < MIN_LEAD_MINUTES * 60000;
    }

    function addScheduleButton(box, platform) {
      const { name, textareaId } = SCHEDULE_PLATFORMS.find((p) => p.platform === platform);
      const textarea = document.getElementById(textareaId);
      const timeInput = document.getElementById(`time-${platform}`);

      const scheduleButton = document.createElement("button");
      scheduleButton.type = "button";
      scheduleButton.textContent = `Schedule ${name} post…`;
      const panel = document.createElement("div");   // the confirm step appears here
      const message = document.createElement("div"); // errors and progress
      message.setAttribute("aria-live", "polite");
      box.append(scheduleButton, panel, message);

      // While confirming or sending, the draft and time can't change.
      function lock(locked) {
        textarea.readOnly = locked;
        timeInput.disabled = locked;
        scheduleButton.hidden = locked;
      }

      function closePanel() {
        panel.textContent = "";
        panel.className = "";
      }

      // Step 1 of 2: check everything, then show the confirm panel. Nothing is sent yet.
      scheduleButton.addEventListener("click", () => {
        message.textContent = "";
        const account = chosenAccount[platform];
        const when = chosenTime[platform];
        const text = textarea.value.trim();
        if (!account) return showMessage(message, `No connected ${name} account. Reload the page and try again.`, "error");
        if (!text) return showMessage(message, "The draft is empty. Write something first.", "error");
        if (!when || tooSoon(when)) {
          return showMessage(message, `Pick a time at least ${MIN_LEAD_MINUTES} minutes from now first.`, "error");
        }
        // Snapshot: exactly what will be sent, whatever happens on the page afterwards.
        lock(true);
        showConfirm({ text, account, when });
      });

      function showConfirm(snapshot) {
        closePanel();
        panel.className = "confirm";

        const heading = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = "Check before scheduling.";
        heading.append(strong, " This will publish publicly at the time below.");
        const textBox = document.createElement("div");
        textBox.className = "confirm-text";
        textBox.textContent = snapshot.text; // exact text, line breaks kept
        const accountLine = document.createElement("p");
        accountLine.textContent = `Account: ${accountLabel(snapshot.account)}`;
        const timeLine = document.createElement("p");
        timeLine.textContent = `Time: ${formatLocal(snapshot.when)} → ${snapshot.when.toISOString()} (UTC)`;

        const confirmButton = document.createElement("button");
        confirmButton.type = "button";
        confirmButton.textContent = "Confirm and schedule";
        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.textContent = "Cancel";

        panel.append(heading, textBox, accountLine, timeLine, confirmButton, cancelButton);

        cancelButton.addEventListener("click", () => {
          closePanel();
          lock(false);
        });

        // Step 2 of 2: send exactly once.
        let sent = false; // backup guard in case two clicks arrive before the button disables
        confirmButton.addEventListener("click", async () => {
          if (sent) return;
          sent = true;
          confirmButton.disabled = true;
          cancelButton.disabled = true;

          if (tooSoon(snapshot.when)) {
            closePanel();
            lock(false);
            return showMessage(message, `That time is now less than ${MIN_LEAD_MINUTES} minutes away. Pick a later time. Nothing was sent.`, "error");
          }

          showMessage(message, "Sending to Blotato…", "muted");
          // Don't let a new import replace the drafts while this is in flight.
          importButton.disabled = true;
          pasteButton.disabled = true;
          let res, data;
          try {
            res = await fetch("/.netlify/functions/schedule", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                platform,
                accountId: String(snapshot.account.id),
                text: snapshot.text,
                scheduledTime: snapshot.when.toISOString(),
              }),
            });
            data = await readJson(res);
          } catch {
            // The request may or may not have reached Blotato. Stay locked.
            closePanel();
            return showMessage(message, "Lost the connection while scheduling, so we don't know if the post was scheduled. Check your schedule at my.blotato.com before trying again (reload the page to retry).", "error");
          } finally {
            importButton.disabled = false;
            pasteButton.disabled = false;
          }

          if (res.ok && data.postSubmissionId) {
            showScheduled(snapshot, data);
          } else if (res.ok || data.outcomeUnknown || res.status >= 500) {
            // Possibly scheduled: stay locked so it can't be sent twice.
            closePanel();
            showMessage(message, `${data.error || "Unexpected reply."} (Reload the page to retry after checking.)`, "error");
          } else {
            // Clearly rejected (4xx): nothing was scheduled, so let the user fix it.
            closePanel();
            lock(false);
            showMessage(message, data.error, "error");
          }
        });
      }

      function showScheduled(snapshot, data) {
        const at = new Date(data.scheduledTime || snapshot.when);
        const when = `${formatLocal(at)} → ${at.toISOString()} (UTC)`;
        box.textContent = ""; // remove every control: nothing left to click twice
        const done = document.createElement("p");
        done.className = "success";
        done.textContent = `Scheduled ✓ ${when}`;
        const id = document.createElement("p");
        id.textContent = `postSubmissionId: ${data.postSubmissionId}`;
        const hint = document.createElement("p");
        hint.className = "muted";
        hint.textContent = "To change or cancel it, use my.blotato.com. Editing the draft here won't change the scheduled post.";
        box.append(done, id, hint);
        textarea.readOnly = true;

        // Keep a record that survives importing a new article.
        const item = document.createElement("li");
        item.textContent = `${name} · ${accountLabel(snapshot.account)} · ${when} · postSubmissionId ${data.postSubmissionId}`;
        document.getElementById("scheduled-log").appendChild(item);
        document.getElementById("scheduled").hidden = false;
      }
    }

    // Live character counter for the X draft, matching the server's check:
    // X counts any link as 23 characters, and [...text] counts an emoji as one.
    const xBox = document.getElementById("draft-x");
    const xCount = document.getElementById("x-count");
    function updateXCount() {
      const length = [...xBox.value.replace(/https?:\/\/\S+/g, "x".repeat(23))].length;
      xCount.textContent = `${length} / ${X_LIMIT} characters`;
      xCount.classList.toggle("over", length > X_LIMIT);
    }
    xBox.addEventListener("input", updateXCount);

    // ---------- Connected accounts (milestone 1) ----------

    const button = document.getElementById("load");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true; // prevent double clicks while waiting
      result.textContent = "Loading…";
      try {
        const res = await fetch("/.netlify/functions/accounts");
        const data = await readJson(res);
        if (!res.ok) {
          showMessage(result, `Error ${res.status}: ${data.error}`, "error");
        } else {
          showAccounts(data.items ?? data);
        }
      } catch {
        showMessage(result, "Couldn't reach the RepostRx server. Check your connection and try again.", "error");
      } finally {
        button.disabled = false;
      }
    });

    function showAccounts(accounts) {
      result.textContent = "";
      if (!Array.isArray(accounts) || accounts.length === 0) {
        result.textContent = "No connected accounts found. Connect one at my.blotato.com.";
        return;
      }
      const list = document.createElement("ul");
      for (const a of accounts) {
        const item = document.createElement("li");
        // textContent shows text as-is, so names can't inject HTML
        item.textContent = accountLabel(a);
        list.appendChild(item);
      }
      result.appendChild(list);
    }
  </script>
</body>
</html>
